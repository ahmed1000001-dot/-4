plugins {
    id 'com.android.application'
}

android {
    namespace 'com.school.canteen'
    compileSdk 34

    defaultConfig {
        applicationId "com.school.canteen"
        minSdk 23
        targetSdk 34
        versionCode 13
        versionName "4.9"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
